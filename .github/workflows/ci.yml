name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  build-and-smoke-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health; then exit 0; fi
            sleep 2
          done
          echo "API never became healthy" && exit 1

      - name: Smoke test — catalogue populated
        run: |
          count=$(curl -sf http://localhost:8080/api/demarches | node -e "process.stdin.on('data', d => console.log(JSON.parse(d).length))")
          echo "demarches: $count"
          [ "$count" -gt 100 ]

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
